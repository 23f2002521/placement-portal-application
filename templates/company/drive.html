<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
<body>
   {% set messages=get_flashed_messages() %}
    {% for msg in messages %}
    <div class="alert alert-warning alert-dismissible fade show mt-3 mx-5" role="alert">
        {{ msg }}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    {% endfor %}
<div class="container d-flex justify-content-center align-items-center min-vh-100">
            <div class="card" style="width: 30%;">
                <div class="card-header">
                    ADD drive details
                </div>
                <div class="card-body">
                    <form method="POST" action="{{ url_for('create_drive') }}">
                      <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="floatingName" name="name"  required>
                        <label for="floatingName">Drive Name</label>
                      </div>

                      <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="floatingtitle" name="job_title"  required>
                        <label for="floatingEmail">Job title</label>
                      </div>

                      <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="floatingdescription" name="job_description"  required>
                        <label for="floatingPassword">job_description</label>
                      </div>
                       <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="floatingcriteria" name="eligibility_criteria"  required>
                        <label for="floatingPassword">eligibility_criteria</label>
                          <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="floatingskills" name="skills"  required>
                        <label for="floatingPassword">skills required</label>
                      </div>
                        <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="floatingexp" name="exp"  required>
                        <label for="floatingPassword">experience</label>
                       <div class="form-floating mb-3">
                        <input type="datetime-local" class="form-control" id="floatingdeadline" name="application_deadline"  required>
                        <label for="floatingPassword">application deadline</label>
                      </div>
                       <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="floatingsalary" name="salary"  required>
                        <label for="floatingsalary">salary</label>
                      </div>
                       

                      <button type="submit" class="btn btn-warning">save</button>
                      <a href="{{url_for('cm_dash')}}"class="btn btn-outline-secondary">Back to dashboard</a>
                    </form>


                </div>
            </div>
        </div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
