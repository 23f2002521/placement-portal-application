<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    {% set messages=get_flashed_messages() %}
    {% for msg in messages %}
    <div class="alert alert-warning alert-dismissible fade show m-3" role="alert">
        {{ msg }}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    {% endfor %}

    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="card" style="width: 36rem;">
            <div class="card-header">
                edit profile
            </div>
            <div class="card-body">
                <form action="{{ url_for('student_profile') }}" method="POST" enctype="multipart/form-data">
                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="floatingname" name="stud_name" value="{{ current_stu.name }}" placeholder="name" required>
                        <label for="floatingname">name</label>
                    </div>

                    <div class="mb-3">
                        <label for="skills" class="form-label">skills</label>
                        <textarea class="form-control" id="skills" name="skills" rows="4">{{ current_stu.skills or '' }}</textarea>
                    </div>

                    <div class="mb-3">
                        <label for="education" class="form-label">education</label>
                        <textarea class="form-control" id="education" name="education" rows="4">{{ current_stu.education or '' }}</textarea>
                    </div>
                    <div class="form-floating mb-3">
                        <label for="department" class="form-label">department</label>
                        <textarea class="form-control" id="department" name="department" rows="4">{{ current_stu.department or '' }}</textarea>
                    </div>


                    <div class="mb-3">
                        <label for="resume" class="form-label">resume</label>
                        <input type="file" class="form-control" id="resume" name="resume" accept=".pdf,.doc,.docx">
                    </div>

                    <button type="submit" class="btn btn-warning">save</button>
                    <a href="{{ url_for('st_dash') }}" class="btn btn-outline-secondary">back</a>
                    {% if current_stu.resume %}
                    <a href="/static/{{ current_stu.resume }}" target="_blank" class="btn btn-outline-primary">view resume</a>
                    {% endif %}
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
